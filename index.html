<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>อ่านให้ติด — Exam Planner</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#111827}
.app{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.logo{font-size:25px;font-weight:800}.sub{color:#6b7280;font-size:13px;margin-top:3px}
button{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer;background:#111827;color:white}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 4px 18px #00000008}
.hero{background:#111827;color:white}.hero .muted{color:#cbd5e1}.hero h1{font-size:31px;margin:6px 0 8px}.progress{height:10px;background:#374151;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#fff;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.stat{background:#ffffff12;border-radius:13px;padding:12px}.stat b{display:block;font-size:21px}.muted{color:#6b7280;font-size:13px}
h2{font-size:18px;margin:0 0 14px}.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eef0f3}.task:last-child{border-bottom:0}.check{width:22px;height:22px;border:2px solid #cbd5e1;border-radius:7px;flex:none}.done .check{background:#111827;border-color:#111827;position:relative}.done .check:after{content:"✓";color:#fff;position:absolute;font-size:14px;left:3px;top:-1px}.done .name{text-decoration:line-through;color:#9ca3af}.taskinfo{flex:1}.tag{display:inline-block;background:#eef2ff;color:#4338ca;border-radius:7px;padding:4px 7px;font-size:11px;margin-top:4px}
form{display:grid;gap:10px}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:11px;font-size:15px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{padding:25px 0;text-align:center;color:#9ca3af}
@media(max-width:750px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.stats{grid-template-columns:1fr 1fr 1fr}.app{padding:15px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="logo">📚 อ่านให้ติด</div><div class="sub">Exam Planner • เวอร์ชันต้นแบบ</div></div>
    <button onclick="resetAll()">รีเซ็ต</button>
  </div>

  <div class="grid">
    <section>
      <div class="card hero">
        <div class="muted">ภารกิจวันนี้</div>
        <h1 id="todayTitle">เริ่มจากสิ่งที่สำคัญที่สุด</h1>
        <div class="muted" id="summary">0 จาก 0 ภารกิจเสร็จแล้ว</div>
        <div class="progress"><div class="bar" id="bar" style="width:0%"></div></div>
        <div class="stats">
          <div class="stat"><b id="remaining">0</b><span class="muted">งานเหลือ</span></div>
          <div class="stat"><b id="minutes">0</b><span class="muted">นาที</span></div>
          <div class="stat"><b id="streak">0</b><span class="muted">🔥 streak</span></div>
        </div>
      </div>

      <div class="card" style="margin-top:18px">
        <h2>🎯 ตารางวันนี้</h2>
        <div id="tasks"></div>
      </div>
    </section>

    <aside class="card">
      <h2>➕ เพิ่มภารกิจ</h2>
      <form onsubmit="addTask(event)">
        <input id="name" placeholder="เช่น อ่านฟังก์ชัน" required>
        <div class="row">
          <select id="subject">
            <option>คณิต</option><option>ฟิสิกส์</option><option>เคมี</option>
            <option>ชีวะ</option><option>อังกฤษ</option><option>ไทย</option><option>สังคม</option>
          </select>
          <input id="mins" type="number" min="5" step="5" value="30" placeholder="นาที">
        </div>
        <select id="priority"><option value="3">สำคัญมาก</option><option value="2">สำคัญ</option><option value="1">ทั่วไป</option></select>
        <button>เพิ่มเข้าวันนี้</button>
      </form>
      <div style="margin-top:22px;padding-top:16px;border-top:1px solid #eee">
        <h2>🧠 หลักการจัดแผน</h2>
        <div class="muted">ระบบต้นแบบจะเรียง “สำคัญมาก → สำคัญ → ทั่วไป” และดันงานที่ยังไม่เสร็จขึ้นมาก่อน</div>
      </div>
    </aside>
  </div>
</div>

<script>
const KEY="exam_plan_v1";
let state=JSON.parse(localStorage.getItem(KEY)||'{"tasks":[],"streak":0}');
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function addTask(e){
 e.preventDefault();
 state.tasks.push({id:Date.now(),name:name.value,subject:subject.value,mins:+mins.value||30,priority:+priority.value,done:false});
 document.getElementById("name").value="";
 save();
}
function toggle(id){let t=state.tasks.find(x=>x.id===id); if(t)t.done=!t.done; save()}
function removeTask(id){state.tasks=state.tasks.filter(x=>x.id!==id);save()}
function render(){
 const tasks=[...state.tasks].sort((a,b)=>(b.priority-a.priority)||(+a.done-+b.done));
 const done=tasks.filter(t=>t.done).length,total=tasks.length;
 document.getElementById("summary").textContent=`${done} จาก ${total} ภารกิจเสร็จแล้ว`;
 document.getElementById("bar").style.width=(total?done/total*100:0)+"%";
 document.getElementById("remaining").textContent=total-done;
 document.getElementById("minutes").textContent=tasks.filter(t=>!t.done).reduce((s,t)=>s+t.mins,0);
 document.getElementById("streak").textContent=state.streak;
 document.getElementById("todayTitle").textContent=total? (done===total?"🔥 วันนี้เอาอยู่!":"ทำภารกิจต่อไปให้เสร็จ"): "เริ่มจากสิ่งที่สำคัญที่สุด";
 const box=document.getElementById("tasks");
 box.innerHTML=tasks.length?tasks.map(t=>`
 <div class="task ${t.done?'done':''}">
   <div class="check" onclick="toggle(${t.id})"></div>
   <div class="taskinfo"><div class="name">${escapeHtml(t.name)}</div><span class="tag">${t.subject} • ${t.mins} นาที</span></div>
   <button style="padding:7px 9px;background:#f3f4f6;color:#6b7280" onclick="removeTask(${t.id})">×</button>
 </div>`).join(""):`<div class="empty">ยังไม่มีภารกิจ<br>เพิ่มงานแรกของมึงได้เลย 👆</div>`;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function resetAll(){if(confirm("ลบข้อมูลทั้งหมด?")){state={tasks:[],streak:0};save()}}
render();
</script>
</body>
</html>
